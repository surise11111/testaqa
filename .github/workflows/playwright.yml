name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
       NEW_USER_1_EMAIL: ${{secrets.New_User_1_Email}}
       NEW_USER_1_PASSWORD: ${{secrets.NEW_USER_1_PASSWORD}}
       UI_BASE_URL: ${{secrets.UI_BASE_URL}}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E2E
      run: npx run ui-e2e
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 5

  api:
    name: API Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{secrets.API_BASE_URL}}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run API
      run: npx run api
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 5        